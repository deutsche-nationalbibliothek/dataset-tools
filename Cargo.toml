[workspace]
resolver = "3"
members = [
  "crates/dataset-cli",
  "crates/dataset-core",
  "crates/datashed-cli",
  "crates/unhyphen",
]

[workspace.package]
authors = ["Nico Wagner <n.wagner@dnb.de>"]
homepage = "https://github.com/deutsche-nationalbibliothek/dataset-tools"
repository = "https://github.com/deutsche-nationalbibliothek/dataset-tools"
edition = "2024"
license = "EUPL-1.2"
rust-version = "1.89"

[workspace.dependencies]
actix-files = { version = "0.7.2" }
actix-web = { version = "4.18.1", features = ["openssl"] }
anyhow = { version = "1.0.104" }
approx = { version = "0.5.1" }
assert_cmd = { version = "2.2.2" }
assert_fs = { version = "1.1.4" }
bstr = { version = "1.13.1" }
clap_complete = { version = "4.6.11" }
dataset-core = { path = "crates/dataset-core", version = "0.1.0" }
env_logger = { version = "0.11.11" }
hashbrown = { version = "0.17.1" }
indexmap = { version = "2.14.2", features = ["serde"] }
indicatif = { version = "0.18.6", features = ["rayon"] }
isbn = { version = "0.8" }
lingua = { version = "1.8.0" }
ndarray = { version = "0.17.2" }
openssl = { version = "0.10.81" }
owo-colors = { version = "4.4.0" }
pica-record = { version = "1.4.0", features = ["serde"] }
predicates = { version = "3.1.4" }
rayon = { version = "1.12.0" }
regex = { version = "1.13.1" }
reqwest = { version = "0.13.5", features = ["json"] }
semver = { version = "1.0.28", features = ["serde"] }
serde_json = { version = "1.0.154" }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = { version = "0.11.1" }
sophia = { version = "0.10.0" }
tar = { version = "0.4.46" }
thiserror = { version = "2.0.21" }
tokio = { version = "1.54.1", features = ["rt"] }
toml_edit = { version = "0.25.17", features = ["serde"] }
unicode_categories = { version = "0.1.1" }
unicode-normalization = { version = "0.1.26" }
url = { version = "2.5.8", features = ["serde"] }
walkdir = { version = "2.5.0" }

[workspace.dependencies.clap]
version = "4.6.7"
features = ["derive", "wrap_help", "env", "cargo"]

[workspace.dependencies.flate2]
version = "1.1.10"
default-features = false
features = ["zlib-rs"]

[workspace.dependencies.polars]
version = "0.55.2"
features = [
  "decompress",
  "default",
  "dtype-slim",
  "dtype-u16",
  "dtype-u8",
  "ipc",
  "is_in",
  "lazy",
  "parquet",
  "semi_anti_join",
  "sql",
  "timezones",
]

[profile.release]
lto = "fat"
panic = "abort"
debug = "none"
codegen-units = 1
opt-level = 3
strip = true
