[workspace]
resolver = "3"
members = [
  "crates/dataset-cli",
  "crates/dataset-core",
  "crates/datashed-cli",
  "crates/unhyphen",
]

[workspace.package]
authors = ["Nico Wagner <n.wagner@dnb.de>"]
homepage = "https://github.com/deutsche-nationalbibliothek/dataset-tools"
repository = "https://github.com/deutsche-nationalbibliothek/dataset-tools"
edition = "2024"
license = "EUPL-1.2"
rust-version = "1.89"

[workspace.dependencies]
actix-files = { version = "0.6" }
actix-web = { version = "4.12", features = ["openssl"] }
anyhow = { version = "1.0.103" }
approx = { version = "0.5" }
assert_cmd = { version = "2.1" }
assert_fs = { version = "1.1" }
bstr = { version = "1.12" }
clap_complete = { version = "4.5" }
dataset-core = { path = "crates/dataset-core", version = "0.1.0" }
env_logger = { version = "0.11" }
hashbrown = { version = "0.17" }
indexmap = { version = "2.12", features = ["serde"] }
indicatif = { version = "0.18", features = ["rayon"] }
isbn = { version = "0.8" }
lingua = { version = "1.8" }
ndarray = { version = "0.17" }
openssl = { version = "0.10" }
owo-colors = { version = "4.2" }
pica-record = { version = "1.4", features = ["serde"] }
predicates = { version = "3.1" }
rayon = { version = "1.11" }
regex = { version = "1.12" }
reqwest = { version = "0.13", features = ["json"] }
semver = { version = "1.0", features = ["serde"] }
serde_json = { version = "1.0" }
serde = { version = "1.0", features = ["derive"] }
sha2 = { version = "0.11" }
sophia = { version = "0.10" }
tar = { version = "0.4" }
thiserror = { version = "2.0" }
tokio = { version = "1.52", features = ["rt"] }
toml_edit = { version = "0.25", features = ["serde"] }
unicode_categories = { version = "0.1" }
unicode-normalization = { version = "0.1" }
url = { version = "2.5", features = ["serde"] }
walkdir = { version = "2.5" }

[workspace.dependencies.clap]
version = "4.5"
features = ["derive","wrap_help","env","cargo"]

[workspace.dependencies.flate2]
version = "1.1"
default-features = false
features = ["zlib-rs"]

[workspace.dependencies.polars]
version = "0.55"
features = [
  "decompress",
  "default",
  "dtype-slim",
  "dtype-u16",
  "dtype-u8",
  "ipc",
  "is_in",
  "lazy",
  "parquet",
  "semi_anti_join",
  "sql",
  "timezones",
]

[profile.release]
lto = "fat"
panic = "abort"
debug = "none"
codegen-units = 1
opt-level = 3
strip = true
